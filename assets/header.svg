<svg xmlns="http://www.w3.org/2000/svg" width="480" height="100" viewBox="0 0 480 100">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
    .bg {
      fill: #000000;
    }
    .text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 28px;
      fill: #39FF14;
      letter-spacing: 2px;
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #39FF14;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <rect class="bg" width="100%" height="100%" rx="10" />
  <image href="https://raw.githubusercontent.com/keepsloading/keepsloading/main/assets/loading.gif" x="15" y="10" width="80" height="80" />
  <text class="text" x="115" y="58">
    KEEPS LOADING<tspan class="cursor">_</tspan>
  </text>
</svg>
